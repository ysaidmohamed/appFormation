<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <meta name="description" content="Créez votre compte Forma.">
    <title>Inscription — Forma</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202b24;
            --muted: #6d786f;
            --green: #276449;
            --green-dark: #1d5038;
            --paper: #f5f7f3;
            --line: #dfe5dc;
            --white: #fff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 28px 18px;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(217, 232, 203, .55), transparent 34%),
                radial-gradient(ellipse at 88% 88%, rgba(225, 235, 214, .55), transparent 35%),
                var(--paper);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.5;
        }

        .signup-card {
            width: min(100%, 420px);
            padding: 42px;
            border: 1px solid rgba(32, 43, 36, .08);
            border-radius: 16px;
            background: var(--white);
            box-shadow: 0 22px 70px rgba(36, 54, 41, .09);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            color: var(--ink);
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -.06em;
            text-decoration: none;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--green);
            color: #e4f1c4;
            font-size: 1rem;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.9rem;
            font-weight: 680;
            letter-spacing: -.06em;
            line-height: 1.2;
        }

        .intro {
            margin: 0 0 25px;
            color: var(--muted);
            font-size: .94rem;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: .87rem;
            font-weight: 650;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--white);
            color: var(--ink);
            font: inherit;
            font-size: .93rem;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input::placeholder { color: #9aa39b; }

        input:focus {
            border-color: var(--green);
            outline: none;
            box-shadow: 0 0 0 3px rgba(39, 100, 73, .12);
        }

        .submit {
            width: 100%;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 7px;
            border: 0;
            border-radius: 7px;
            background: var(--green);
            color: var(--white);
            cursor: pointer;
            font: inherit;
            font-size: .94rem;
            font-weight: 650;
            transition: background .2s ease;
        }

        .submit:hover { background: var(--green-dark); }

        .submit:focus-visible, .footer a:focus-visible {
            outline: 3px solid #84a849;
            outline-offset: 3px;
        }

        .message {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: .86rem;
            text-align: center;
        }

        .message.error { color: #a12626; }
        .message.success { color: var(--green); }

        .footer {
            margin: 22px 0 0;
            color: var(--muted);
            font-size: .86rem;
            text-align: center;
        }

        .footer a {
            color: var(--green);
            font-weight: 650;
            text-decoration: none;
        }

        .footer a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .signup-card { padding: 32px 24px; }
            .brand { margin-bottom: 26px; }
        }
    </style>
</head>
<body>
<main class="signup-card">
    // Logo
    <a class="brand" href="/" aria-label="Forma, accueil">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Forma</span>
    </a>
    <h1>Créer un compte</h1>
    <p class="intro">Rejoignez Forma pour accéder à votre espace de formation.</p>

    // Formulaire d'inscription avec nom, prénom, identifiant et mot de passe
    <form id="signup-form">
        <div class="field">
            <label for="nom">Nom</label>
            <input id="nom" name="nom" type="text" autocomplete="family-name" placeholder="Votre nom" required>
        </div>
        <div class="field">
            <label for="prenom">Prénom</label>
            <input id="prenom" name="prenom" type="text" autocomplete="given-name" placeholder="Votre prénom" required>
        </div>
        <div class="field">
            <label for="username">Identifiant</label>
            <input id="username" name="login" type="text" autocomplete="username" placeholder="Choisissez un identifiant" required>
        </div>
        <div class="field">
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Choisissez un mot de passe" required>
        </div>
        <button class="submit" type="submit">Créer mon compte <span aria-hidden="true">→</span></button>
    </form>

    // Message d'état de l'inscription et lien vers la page de connexion
    <p class="message" id="signup-message" role="status" aria-live="polite"></p>
    <p class="footer">Vous avez déjà un compte ? <a href="/">Se connecter</a></p>
</main>
<script>
    const signupForm = document.querySelector("#signup-form");
    const signupMessage = document.querySelector("#signup-message");

    const submitButton = signupForm.querySelector("button[type='submit']");

    // Gestion de la soumission du formulaire d'inscription : envoi des données et traitement de la réponse
    signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        signupMessage.textContent = "";
        signupMessage.classList.remove("error", "success");
        submitButton.disabled = true;

        try {
            const csrfResponse = await fetch("/api/csrf", { cache: "no-store" });
            if (!csrfResponse.ok) throw new Error("Impossible de sécuriser la création du compte.");
            const csrf = await csrfResponse.json();
            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": csrf.token
                },
                body: JSON.stringify({
                    nom: signupForm.elements.nom.value,
                    prenom: signupForm.elements.prenom.value,
                    login: signupForm.elements.login.value,
                    password: signupForm.elements.password.value
                })
            });
            const result = await response.json().catch(() => ({}));
            signupMessage.textContent = result.message
                || (response.ok
                    ? "Inscription réussie."
                    : `L'inscription a échoué (erreur ${response.status}). Réessayez ou contactez l'administrateur.`);
            signupMessage.classList.add(response.ok ? "success" : "error");
            if (response.ok) {
                signupForm.reset();
            }
        } catch {
            signupMessage.textContent = "Impossible de contacter le serveur. Réessayez plus tard.";
            signupMessage.classList.add("error");
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
